name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Smoke test
        run: |
          cargo run -q -- --color always -w 100
          cargo run -q -- --flat -a -l --color never -w 120
          cargo run -q -- --disks -T --color never
          cargo run -q -- --json > /dev/null
          cargo run -q -- --color never /
