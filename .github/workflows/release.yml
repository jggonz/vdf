name: Release

# Push a tag like v1.2.3 (matching the version in Cargo.toml) to build and
# publish a release with these assets:
#   vdf-X.Y.Z.pkg                       macOS installer (universal binary)
#   vdf-X.Y.Z-macos-universal.tar.gz    macOS binary, man page and docs
#   vdf-X.Y.Z-linux-{x86_64,aarch64}.tar.gz  static (musl) Linux binaries
#   SHA256SUMS
#
# Optional repository secrets:
#   MACOS_CERTS_P12, MACOS_CERTS_PASSWORD          base64 .p12 holding Developer ID certificates
#   MACOS_APP_SIGN_IDENTITY, MACOS_INSTALLER_SIGN_IDENTITY
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD
#   HOMEBREW_TAP_TOKEN                             token that can push to jggonz/homebrew-tap

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches Cargo.toml
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml version $v does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} /^\[.*\]: / {f=0} f' CHANGELOG.md > notes.md
          {
            echo
            echo "### Install"
            echo
            echo '**macOS installer:** download `vdf-'"$v"'.pkg` below and open it.'
            echo
            echo '**Homebrew** (macOS and Linux): `brew install jggonz/tap/vdf`'
            echo
            echo '**Manual:** download the tarball for your platform, extract it, and put `vdf` on your `PATH`.'
          } >> notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "vdf $v" --notes-file notes.md

  macos:
    needs: create
    runs-on: macos-latest
    env:
      MACOS_CERTS_P12: ${{ secrets.MACOS_CERTS_P12 }}
      MACOS_CERTS_PASSWORD: ${{ secrets.MACOS_CERTS_PASSWORD }}
      APP_SIGN_IDENTITY: ${{ secrets.MACOS_APP_SIGN_IDENTITY }}
      INSTALLER_SIGN_IDENTITY: ${{ secrets.MACOS_INSTALLER_SIGN_IDENTITY }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Install targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Test
        run: cargo test
      - name: Build universal binary
        run: |
          make universal
          lipo -info target/universal/vdf
          target/universal/vdf --version
      - name: Import signing certificates
        if: env.MACOS_CERTS_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_CERTS_P12" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$MACOS_CERTS_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certs.p12"
      - name: Package
        run: |
          v=${GITHUB_REF_NAME#v}
          if [ -n "$APP_SIGN_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --sign "$APP_SIGN_IDENTITY" target/universal/vdf
          fi
          packaging/make-tarball.sh "$v" target/universal/vdf dist macos-universal
          packaging/macos/build-pkg.sh "$v" target/universal/vdf dist
          pkgutil --payload-files "dist/vdf-$v.pkg"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.pkg dist/*.sha256 --clobber

  linux:
    needs: create
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add ${{ matrix.target }}
      - name: Test
        run: cargo test
      - name: Build static binary
        run: |
          cargo build --release --target ${{ matrix.target }}
          file target/${{ matrix.target }}/release/vdf
          target/${{ matrix.target }}/release/vdf --version
      - name: Package
        run: packaging/make-tarball.sh "${GITHUB_REF_NAME#v}" target/${{ matrix.target }}/release/vdf dist linux-${{ matrix.arch }}
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber

  publish:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Checksums
        run: |
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          cat sums/*.sha256 | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --clobber
          for f in sums/*.sha256; do gh release delete-asset "$GITHUB_REF_NAME" "$(basename "$f")" --yes; done
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Update Homebrew tap
        if: env.TAP_TOKEN != ''
        run: |
          v=${GITHUB_REF_NAME#v}
          packaging/homebrew/generate-formula.sh "$v" SHA256SUMS > vdf.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/jggonz/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp vdf.rb tap/Formula/vdf.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/vdf.rb
          git commit -m "vdf $v" || exit 0
          git push
