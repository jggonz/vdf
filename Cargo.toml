[package]
name = "vdf"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Visual disk free: df -h with colour-gradient usage bars, grouped by physical disk"
license = "MIT"
repository = "https://github.com/jggonz/vdf"
readme = "README.md"
keywords = ["df", "disk", "cli", "terminal", "storage"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/packaging", "/docs", "/Makefile"]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
libc = "0.2.191"
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
