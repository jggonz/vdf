<h2>vdf is installed</h2>
<p>Open Terminal and run:</p>
<pre>vdf</pre>
<p>Run <code>vdf --help</code> or <code>man vdf</code> to see all the options.</p>
<p>To uninstall:</p>
<pre>sudo rm /usr/local/bin/vdf /usr/local/share/man/man1/vdf.1
sudo pkgutil --forget io.github.jggonz.vdf</pre>
